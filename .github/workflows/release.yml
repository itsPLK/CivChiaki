name: Release Chiaki

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Read version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -c "import json; print(json.load(open('payload.json'))['release'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v$version already exists; bump \"release\" in payload.json" >&2
            exit 1
          fi
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential cmake ninja-build
      - run: npm run bootstrap
      - run: npm run build
      - run: npm test
      - run: npm run test:runtime
      - run: npm run package
      - name: Checksums
        run: cd dist && sha256sum chiaki.civapp > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "v${{ steps.version.outputs.version }}"
          dist/chiaki.civapp dist/SHA256SUMS
          --target "$GITHUB_SHA"
          --title "Chiaki ${{ steps.version.outputs.version }}"
          --generate-notes
